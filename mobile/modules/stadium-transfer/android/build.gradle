apply plugin: 'com.android.library'
android {
  namespace 'com.helyon.transfer'
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig { minSdk 24; targetSdk rootProject.ext.targetSdkVersion }
}
dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'com.github.mwiede:jsch:2.28.8'
  // Match react-native-tcp-socket's Android artifact family. PKIX also keeps
  // its provider and utility dependencies on the same version.
  implementation 'org.bouncycastle:bcpkix-jdk15to18:1.86'
}
