name: Feature request
description: Suggest a concrete addition or improvement
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature. For larger or
        architectural changes, please file an RFC instead. For open-ended
        ideas, start a Discussion in the "Ideas" category.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        Describe the use case or pain point, not the implementation. What
        are you trying to do, and why is the current behaviour insufficient?
      placeholder: I want to set scribble strip labels for all four stomps at once instead of one at a time.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A rough sketch of what you have in mind. Code is welcome but not required.
      placeholder: |
        Add a `--stomps` flag to `helix_control scribble-label` that accepts
        a comma-separated list of stomp positions and labels.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Python library (helix/)
        - Python scripts (scripts/)
        - Mobile app (mobile/)
        - Generated data (generated/)
        - Docs
        - Build / CI
        - Cross-cutting
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why this one is better.

  - type: dropdown
    id: contribution
    attributes:
      label: Would you be willing to help implement this?
      options:
        - Yes, with guidance
        - Yes, I can drive it
        - No, but happy to test
        - No
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mockups, related issues, links, captures, references.
